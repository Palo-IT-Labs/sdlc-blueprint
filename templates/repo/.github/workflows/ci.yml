# Workflow d'appel : à copier dans le repo d'équipe.
# Remplacer __ORG__ par l'organisation qui héberge sdlc-blueprint.
# Ne pas renommer le job "ci" sans mettre à jour le contrôle requis du ruleset ("ci / build-test").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: __ORG__/sdlc-blueprint/.github/workflows/reusable-ci-java.yml@main
    with:
      java-version: "21"
